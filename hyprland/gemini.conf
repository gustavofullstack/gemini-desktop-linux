# Hyprland (config clássica): Gemini sempre na própria mesa
windowrule = workspace 6, class:^(gemini)$
# Atalho global (como o Option+Space do app de macOS): SUPER+I abre/alterna o Gemini
bind = SUPER, I, exec, gemini-toggle
# Compartilhar janela ativa com o Gemini (como o ⌘+⌘ do macOS): SUPER+SHIFT+I
bind = SUPER SHIFT, I, exec, gemini-share
